<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="36" fill="#0d1527" />
  <circle cx="100" cy="100" r="82" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="4" filter="url(#shadow)" />
  <circle cx="100" cy="100" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="6,4" />
  <!-- Group Pill -->
  <rect x="76" y="32" width="48" height="20" rx="10" fill="#0a101d" fill-opacity="0.8" />
  <text x="100" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#60a5fa" text-anchor="middle" letter-spacing="1">GRP A</text>
  <!-- Short Name -->
  <text x="100" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CHE</text>
  <!-- Team Name banner -->
  <rect x="25" y="142" width="150" height="24" rx="12" fill="#070c16" fill-opacity="0.75" />
  <text x="100" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">Chemical Engineering</text>
</svg>